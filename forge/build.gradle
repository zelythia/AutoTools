plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { url "https://maven.shedaniel.me/" }
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name
        mixinConfig "autotools-common.mixins.json"
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }

    modApi("me.shedaniel.cloth:cloth-config-forge:${rootProject.cloth_config_version}")

    modCompileOnlyApi("curse.maven:controllable-317269:6171424")
}

base {
    archivesName = rootProject.archives_base_name + "-" + rootProject.minecraft_version + "-forge"
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}


sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}



publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
            pom {
                name = 'AutoTools'
                description = 'A Minecraft mod for automatically switching to the correct tool to use on a block/mob.'
                url = 'https://github.com/zelythia/AutoTools'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/license/mit'
                    }
                }
                developers {
                    developer {
                        id = 'zelythia'
                        name = 'Lukas Z'
                        email = 'dev@zelythia.net'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/zelytiha/autotools.git'
                    developerConnection = 'scm:git:ssh://github.com/zelythia/autotools.git'
                    url = 'http://github.com/zelythia/autotools'
                }
            }
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        maven {
            url = rootProject.layout.buildDirectory.dir('staging-deploy')
        }

        if (project.version.toString().contains("-SNAPSHOT")) {
            maven {
                name = "zelythiaMavenSnapshots"
                url = uri("https://maven.zelythia.net/snapshots")
                credentials{
                    username = System.getenv('MAVEN_USERNAME')?: project.findProperty('mavenUser')
                    password = System.getenv('MAVEN_PASSWORD')?: project.findProperty('mavenPassword')
                }
                authentication {
                    basic(BasicAuthentication)
                }
            }
        }
        else{
            maven {
                name = "zelythiaMavenRepositoryReleases"
                url = uri("https://maven.zelythia.net/releases")
                credentials{
                    username = System.getenv('MAVEN_USERNAME')?: project.findProperty('mavenUser')
                    password = System.getenv('MAVEN_PASSWORD')?: project.findProperty('mavenPassword')
                }
                authentication {
                    basic(BasicAuthentication)
                }
            }

            if (System.getenv("GITHUB_ACTOR") && System.getenv("GITHUB_TOKEN")) {
                maven {
                    name = "GitHubPackages"
                    url = "https://maven.pkg.github.com/zelythia/AutoTools"
                    credentials {
                        username = System.getenv("GITHUB_ACTOR")
                        password = System.getenv("GITHUB_TOKEN")
                    }
                }
            }
        }
    }
}
