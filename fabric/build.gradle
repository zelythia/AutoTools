plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

repositories {
    maven { url "https://maven.terraformersmc.com/" } //ModMenu
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

base {
    archivesName = rootProject.archives_base_name + "-fabric"
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }

    modImplementation("com.terraformersmc:modmenu:${rootProject.modmenu_version}") {
        transitive = false
    }

    modApi("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    //Fabric API modules
    modRuntimeOnly "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    includeFabricApiModule "fabric-key-binding-api-v1"
    includeFabricApiModule "fabric-lifecycle-events-v1"
    includeFabricApiModule "fabric-api-base"
    includeFabricApiModule "fabric-item-api-v1"
    includeFabricApiModule "fabric-networking-api-v1"
}

def includeFabricApiModule(String moduleName) {
    Object dependency = fabricApi.module(moduleName, rootProject.fabric_api_version)

    dependencies.modImplementation(dependency)
    dependencies.include(dependency)
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    injectAccessWidener = true
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
            pom {
                name = 'AutoTools'
                description = 'A Minecraft mod for automatically switching to the correct tool to use on a block/mob.'
                url = 'https://github.com/zelythia/AutoTools'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/license/mit'
                    }
                }
                developers {
                    developer {
                        id = 'zelythia'
                        name = 'Lukas Z'
                        email = 'dev@zelythia.net'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/zelytiha/autotools.git'
                    developerConnection = 'scm:git:ssh://github.com/zelythia/autotools.git'
                    url = 'http://github.com/zelythia/autotools'
                }
            }
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        maven {
            url = rootProject.layout.buildDirectory.dir('staging-deploy')
        }

        if (project.version.toString().contains("-SNAPSHOT")) {
            maven {
                name = "zelythiaMavenSnapshots"
                url = uri("https://maven.zelythia.net/snapshots")
                credentials{
                    username = System.getenv('MAVEN_USERNAME')?: project.findProperty('mavenUser')
                    password = System.getenv('MAVEN_PASSWORD')?: project.findProperty('mavenPassword')
                }
                authentication {
                    basic(BasicAuthentication)
                }
            }
        }
        else{
            maven {
                name = "zelythiaMavenRepositoryReleases"
                url = uri("https://maven.zelythia.net/releases")
                credentials{
                    username = System.getenv('MAVEN_USERNAME')?: project.findProperty('mavenUser')
                    password = System.getenv('MAVEN_PASSWORD')?: project.findProperty('mavenPassword')
                }
                authentication {
                    basic(BasicAuthentication)
                }
            }

            if (System.getenv("GITHUB_ACTOR") && System.getenv("GITHUB_TOKEN")) {
                maven {
                    name = "GitHubPackages"
                    url = "https://maven.pkg.github.com/zelythia/AutoTools"
                    credentials {
                        username = System.getenv("GITHUB_ACTOR")
                        password = System.getenv("GITHUB_TOKEN")
                    }
                }
            }
        }
    }
}
